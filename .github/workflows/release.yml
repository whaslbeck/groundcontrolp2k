name: release

# Runs when a version tag such as v1.0.0 is pushed. Builds the programs for
# all platforms and attaches them, with SHA256 checksums, to a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Build all platforms
        run: make dist
      - name: Checksums
        working-directory: dist
        run: sha256sum groundcontrol-* > SHA256SUMS
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
